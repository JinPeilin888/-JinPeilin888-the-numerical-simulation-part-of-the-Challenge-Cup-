[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mgc-cable-deployment"
version = "0.1.0"
description = "2D dynamic deployment model for a flexible underwater optical cable"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "PyYAML>=6.0", "matplotlib>=3.7", "scipy>=1.10"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
